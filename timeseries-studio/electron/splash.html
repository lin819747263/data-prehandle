<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TimeSeries Studio</title>
<style>
  /* 取工作台的同一套色板：slate-100 页面底、白卡 + slate-200 描边、indigo-600 主色、emerald-500 成功 */
  :root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --line: #e2e8f0;
    --ink: #1e293b;
    --muted: #94a3b8;
    --soft: #64748b;
    --primary: #4f46e5;
    --primary-soft: #eef2ff;
    --ok: #10b981;
    --ok-soft: #ecfdf5;
    --warn: #e11d48;
    --warn-soft: #fff1f2;
    --mono: Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100% }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 13px;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }
  .card {
    height: 100vh;
    background: var(--card);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
  }
  .accent { height: 3px; background: linear-gradient(90deg, var(--primary), #818cf8 55%, #22d3ee); flex: none }

  header { display: flex; align-items: center; gap: 10px; padding: 14px 18px 10px }
  .mark {
    width: 32px; height: 32px; border-radius: 8px; background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(79, 70, 229, .35);
    -webkit-app-region: no-drag; cursor: pointer; flex: none
  }
  .mark svg { display: block }
  h1 { font-size: 15px; font-weight: 700; letter-spacing: .2px; line-height: 1.15 }
  .sub { font-size: 11px; color: var(--muted) }
  .pill {
    margin-left: auto; font-size: 11px; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--soft); display: flex; align-items: center; gap: 5px; flex: none
  }
  .pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); display: block; transition: background .3s }
  .pill.ok { color: #047857; border-color: #a7f3d0; background: var(--ok-soft) }
  .pill.ok i { background: var(--ok) }
  .pill.bad { color: #be123c; border-color: #fecdd3; background: var(--warn-soft) }
  .pill.bad i { background: var(--warn) }

  .viz { position: relative; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: #fff }
  canvas { display: block; width: 100%; height: 128px }
  .chip {
    position: absolute; right: 10px; top: 8px; font-family: var(--mono); font-size: 10px; color: var(--soft);
    background: rgba(248, 250, 252, .92); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px
  }

  .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 12px 18px 4px }
  .step {
    display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; transition: all .3s
  }
  .box {
    width: 13px; height: 13px; border-radius: 4px; border: 1.5px solid #cbd5e1; flex: none; position: relative;
    display: flex; align-items: center; justify-content: center; transition: all .3s
  }
  .box svg { opacity: 0; transform: scale(.4); transition: all .25s }
  .step.on { color: var(--ink); border-color: #c7d2fe; background: var(--primary-soft) }
  .step.on .box { border-color: var(--primary); animation: pulse 1.1s ease-in-out infinite }
  .step.done { color: #047857; border-color: #a7f3d0; background: var(--ok-soft) }
  .step.done .box { background: var(--ok); border-color: var(--ok); animation: none }
  .step.done .box svg { opacity: 1; transform: scale(1) }
  .step.bad { color: #be123c; border-color: #fecdd3; background: var(--warn-soft) }
  .step.bad .box { border-color: var(--warn); background: var(--warn); animation: none }
  .step.bad .box::before, .step.bad .box::after {
    content: ''; position: absolute; left: 2.6px; top: 5.6px; width: 8px; height: 1.8px; border-radius: 1px; background: #fff
  }
  .step.bad .box::before { transform: rotate(45deg) }
  .step.bad .box::after { transform: rotate(-45deg) }
  .step .val { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46% }
  .step.done .val, .step.on .val { color: inherit }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, .35) } 50% { box-shadow: 0 0 0 4px rgba(79, 70, 229, .12) } }

  .row { display: flex; align-items: center; gap: 9px; padding: 8px 18px 0 }
  #phase { font-weight: 600; font-size: 12.5px }
  #meta { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums }
  .bar { height: 5px; border-radius: 999px; background: #eef2f7; overflow: hidden; margin: 8px 18px 0 }
  .bar > div { height: 100%; width: 3%; border-radius: 999px; background: linear-gradient(90deg, var(--primary), #6366f1 60%, #22d3ee); transition: width .55s cubic-bezier(.22, 1, .36, 1) }
  .tip { display: flex; gap: 7px; align-items: flex-start; padding: 10px 18px 0; font-size: 11.5px; color: var(--soft); min-height: 32px }
  .tip b { color: var(--primary); font-weight: 600; flex: none }
  .tip span { transition: opacity .35s }

  .err { display: none; margin: 10px 18px 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #fecdd3; background: var(--warn-soft) }
  .err.show { display: block }
  .err h2 { font-size: 12px; color: #be123c; margin-bottom: 6px; display: flex; align-items: center; gap: 6px }
  .err pre {
    font-family: var(--mono); font-size: 10.5px; color: #9f1239; white-space: pre-wrap; word-break: break-all;
    max-height: 72px; overflow: auto; background: rgba(255, 255, 255, .7); padding: 6px 8px; border-radius: 6px;
    -webkit-app-region: no-drag
  }
  .actions { display: flex; gap: 8px; margin-top: 9px; -webkit-app-region: no-drag }
  button {
    font: inherit; font-size: 11.5px; padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--soft); transition: all .15s
  }
  button:hover { border-color: #c7d2fe; color: var(--primary) }
  button.primary { background: #1e293b; border-color: #1e293b; color: #fff; font-weight: 500 }
  button.primary:hover { background: #334155; color: #fff }

  footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; border-top: 1px solid var(--line); font-size: 10.5px; color: var(--muted); background: #fbfcfe
  }
  footer .egg { opacity: 0; transition: opacity .3s; color: var(--primary) }
  footer .egg.show { opacity: 1 }
</style>
</head>
<body>
<div class="card">
  <div class="accent"></div>

  <header>
    <div class="mark" id="mark" title="TimeSeries Studio">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 17l5-6 4 3 5-8 4 5" />
      </svg>
    </div>
    <div>
      <h1>TimeSeries Studio</h1>
      <p class="sub">新能源与电力负荷时序数据工程平台</p>
    </div>
    <div class="pill" id="ver"><i></i><span>desktop</span></div>
  </header>

  <div class="viz">
    <canvas id="wave"></canvas>
    <div class="chip" id="chip">booting</div>
  </div>

  <div class="steps">
    <div class="step" data-step="frontend"><span class="box"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span>工作台前端<span class="val" data-val="frontend"></span></div>
    <div class="step" data-step="spawn"><span class="box"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span>拉起后端进程<span class="val" data-val="spawn"></span></div>
    <div class="step" data-step="probe"><span class="box"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span>/api/health 探活<span class="val" data-val="probe"></span></div>
    <div class="step" data-step="ready"><span class="box"><svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span>进入工作台<span class="val" data-val="ready"></span></div>
  </div>

  <div class="row">
    <div id="phase">正在启动工作台前端…</div>
    <div id="meta">0.0s · 等待状态</div>
  </div>
  <div class="bar"><div id="fill"></div></div>

  <div class="tip"><b>提示</b><span id="tip"></span></div>

  <div class="err" id="err">
    <h2>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01M10.3 3.9L2.6 17.5A2 2 0 004.3 20.5h15.4a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
      后端没能启动
    </h2>
    <pre id="errmsg"></pre>
    <div class="actions">
      <button class="primary" id="retry">重试</button>
      <button id="quit">退出应用</button>
    </div>
  </div>

  <footer>
    <span>数据加工在服务端进行，工作台只持有当前页窗口</span>
    <span class="egg" id="egg"></span>
  </footer>
</div>

<script>
  const bridge = window.tssDesktop || {}
  const STEPS = ['frontend', 'spawn', 'probe', 'ready']
  // 每个阶段对应：点亮哪一步、进度条到哪、这一步的右侧计数怎么写
  const PHASES = {
    boot: { step: 'frontend', to: 14, val: '' },
    'frontend-ready': { step: 'frontend', to: 22, done: true, val: (m) => hostOf(m.detail) },
    spawning: { step: 'spawn', to: 34, val: (m) => (m.runtime === 'exe' ? '打包版 exe' : 'uvicorn') },
    probing: { step: 'spawn', to: 42, done: true, val: () => '监听中' },
    waiting: { step: 'probe', to: 90, val: (m) => `第 ${m.attempt || 1} 次` },
    ready: { step: 'ready', to: 100, done: true, val: (m) => `能力 ${m.capabilities ?? 0} 项` }
  }
  const TIPS = [
    '明细表留在后端，这里只显示当前页附近的行。',
    '撤销不是幻觉：后端逐条记命令日志，回退就是换个游标。',
    '冷启动慢的那几秒是 Python 在 import pandas，不是你的数据。',
    '孤立森林在排队挑刺，不过通常 3σ 先上。',
    '重采样之前先看一眼缺失率，别让均值是猜出来的。',
    '宽表直出不过网络：Parquet / Feather 由后端直接编码。',
    '一列能不能当时间轴，看的是整表解析命中率，不是列名像不像。',
    '关掉窗口，后端进程会跟着一起退出，不会留一个在后台占端口。'
  ]
  const EGGS = [
    '彩蛋：这条折线刚才替你跑了整个启动流程。',
    '彩蛋：想快点？把数据先攒够 2,880 行再回来。',
    '彩蛋：此刻后端正在读的代码比你的表还长。'
  ]

  const el = {
    phase: document.getElementById('phase'), meta: document.getElementById('meta'),
    fill: document.getElementById('fill'), spin: document.getElementById('chip'),
    tip: document.getElementById('tip'), err: document.getElementById('err'),
    errmsg: document.getElementById('errmsg'), ver: document.getElementById('ver'),
    egg: document.getElementById('egg')
  }
  const vals = {}
  document.querySelectorAll('[data-val]').forEach((s) => { vals[s.dataset.val] = s })
  const hostOf = (u) => { try { return new URL(u).host } catch (e) { return u || '' } }

  // 闪屏不可缩放，出错面板一出来就得让主进程把窗口撑高，否则重试按钮会被裁掉
  const BASE_H = 420
  function applyErrorPanel(show) {
    el.err.classList.toggle('show', show)
    const extra = show ? el.err.getBoundingClientRect().height + 14 : 0
    bridge.resize && bridge.resize(Math.round(BASE_H + extra))
  }

  let stepIndex = 0, target = 6, current = 0, attempts = 0, phaseKey = 'boot', failed = -1
  const started = performance.now()
  el.ver.querySelector('span').textContent = `desktop · ${bridge.mode || 'renderer'}`

  function paintSteps() {
    document.querySelectorAll('.step').forEach((s) => {
      const i = STEPS.indexOf(s.dataset.step)
      s.classList.toggle('on', i === stepIndex && failed < 0)
      // 失败只把当前这一步染红，前面已经完成的步骤要留着绿勾（前端确实起来了）
      s.classList.toggle('done', i < stepIndex)
      s.classList.toggle('bad', i === failed)
    })
  }
  function setPhase(key, msg) {
    const p = PHASES[key] || PHASES.boot
    phaseKey = key
    const i = STEPS.indexOf(p.step)
    if (p.done) stepIndex = Math.max(stepIndex, i + 1)
    else stepIndex = Math.max(stepIndex, i)
    if (msg && msg.text) el.phase.textContent = msg.text
    else el.phase.textContent = { boot: '正在启动工作台前端…', 'frontend-ready': '工作台前端已就绪', spawning: '正在拉起 Python 后端…', waiting: '后端正在载入依赖…', probing: '等待 uvicorn 监听端口…', ready: '后端已就绪，正在进入工作台' }[key]
    if (p.val) { const v = p.val(msg || {}); STEPS.forEach((n, j) => { if (vals[n]) vals[n].textContent = j === i ? v : vals[n].textContent }) }
    target = Math.max(target, p.to)
    paintSteps()
  }
  function tickMeta() {
    el.meta.textContent = `${((performance.now() - started) / 1000).toFixed(1)}s · 探测 ${attempts} 次`
  }
  tickMeta(); setInterval(tickMeta, 200)

  if (bridge.onStatus) {
    bridge.onStatus((msg) => {
      if (msg.attempt) attempts = msg.attempt
      if (msg.phase === 'ready') {
        setPhase('ready', msg)
        vals.spawn.textContent = msg.adopted ? '复用' : (msg.runtime === 'exe' ? '打包版 exe' : '已启动')
        // 复用既有后端时不会走轮询，探活其实就一次请求；不说谎，也不留个空值
        if (msg.adopted) { attempts = 1; vals.probe.textContent = '1 次即中' }
        el.spin.textContent = `${((performance.now() - started) / 1000).toFixed(1)}s · ${hostOf(msg.apiBase)}`
        el.ver.className = 'pill ok'; el.ver.querySelector('span').textContent = `后端 v${msg.version || ''}`.trim()
      } else if (msg.phase === 'error') {
        failed = stepIndex
        el.phase.textContent = '启动失败'
        el.ver.className = 'pill bad'; el.ver.querySelector('span').textContent = '未就绪'
        el.errmsg.textContent = msg.message || '未知错误'
        applyErrorPanel(true)
        target = Math.max(target, 92)
        paintSteps()
      } else {
        setPhase(msg.phase, msg)
      }
    })
    bridge.splashReady && bridge.splashReady()
  }

  document.getElementById('retry').onclick = () => {
    applyErrorPanel(false); failed = -1
    el.ver.className = 'pill'; el.ver.querySelector('span').textContent = `desktop · ${bridge.mode || 'renderer'}`
    bridge.action && bridge.action('retry-backend')
  }
  document.getElementById('quit').onclick = () => bridge.action && bridge.action('quit')

  // 连点三次 logo：翻出彩蛋文案（纯本地彩蛋，不影响任何启动逻辑）
  let taps = 0
  document.getElementById('mark').onclick = () => {
    taps += 1
    if (taps < 3) return
    taps = 0
    el.egg.textContent = EGGS[Math.floor(Math.random() * EGGS.length)]
    el.egg.classList.add('show')
    setTimeout(() => el.egg.classList.remove('show'), 5200)
  }

  let tipIndex = Math.floor(Math.random() * TIPS.length)
  const paintTip = () => {
    el.tip.style.opacity = 0
    setTimeout(() => { el.tip.textContent = TIPS[tipIndex % TIPS.length]; el.tip.style.opacity = 1 }, 300)
    tipIndex += 1
  }
  paintTip(); setInterval(paintTip, 3600)

  const cv = document.getElementById('wave'), ctx = cv.getContext('2d')
  function resize() {
    const dpr = window.devicePixelRatio || 1
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr)
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  }
  resize(); addEventListener('resize', resize)

  // 折线：等后端的时候抖，就绪的一刻淡出一张笑脸
  const N = 300, data = new Array(N).fill(0)
  let tick = 0, face = 0
  function sample(t) {
    const calm = phaseKey === 'ready' ? .25 : (phaseKey === 'waiting' || phaseKey === 'probing' ? 1 : .55)
    const spike = Math.exp(-Math.pow(((t / 30) % 30) - 15, 2) / 5)
    const sag = Math.sin(t / 47) * .35
    return (sag + Math.sin(t / 7.5) * .3 + (Math.random() - .5) * .5 * calm + spike * 1.15) * (calm * .55 + .28)
  }
  const BARS = 30
  function draw() {
    const w = cv.clientWidth, h = cv.clientHeight
    ctx.clearRect(0, 0, w, h)
    tick += 1
    current += (target - current) * .05
    face += ((phaseKey === 'ready' ? 1 : 0) - face) * .07

    ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 1
    for (let i = 1; i < 4; i++) { const y = (h / 4) * i; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke() }

    // 底部小直方图：柱高随启动进度长出来，像数据正在被灌进来
    const prog = current / 100
    for (let i = 0; i < BARS; i++) {
      const bw = (w / BARS) * .55, x = (w / BARS) * (i + .22)
      const filled = (i + 1) / BARS <= prog
      const bh = 4 + (Math.sin(i * 1.7 + tick / 22) * .5 + .5) * 16 * (filled ? 1 : .18)
      ctx.fillStyle = filled ? (phaseKey === 'ready' ? '#a7f3d0' : '#e0e7ff') : '#f1f5f9'
      ctx.fillRect(x, h - bh, bw, bh)
    }

    data.push(sample(tick)); data.shift()
    const mid = h * .46, amp = h * .3
    const grad = ctx.createLinearGradient(0, 0, w, 0)
    grad.addColorStop(0, 'rgba(99, 102, 241, .35)'); grad.addColorStop(1, phaseKey === 'ready' ? '#10b981' : '#4f46e5')
    ctx.beginPath()
    data.forEach((v, i) => {
      const x = (w / (N - 1)) * i, y = mid - v * amp
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)
    })
    ctx.strokeStyle = grad; ctx.lineWidth = 1.9; ctx.lineJoin = 'round'; ctx.stroke()

    const area = ctx.createLinearGradient(0, mid - amp, 0, h)
    area.addColorStop(0, 'rgba(79, 70, 229, .12)'); area.addColorStop(1, 'rgba(79, 70, 229, 0)')
    ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.closePath(); ctx.fillStyle = area; ctx.fill()

    // 三个"被抓到的异常点"在折线上随进度点亮
    for (let k = 0; k < 3; k++) {
      const idx = Math.floor(N * (.3 + k * .26))
      if ((idx + 1) / N > prog) continue
      const x = (w / (N - 1)) * idx, y = mid - data[idx] * amp
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI * 2)
      ctx.fillStyle = phaseKey === 'ready' ? '#10b981' : '#e11d48'; ctx.fill()
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2; ctx.stroke()
    }

    const ly = mid - data[N - 1] * amp
    ctx.beginPath(); ctx.arc(w - 2, ly, 3, 0, Math.PI * 2); ctx.fillStyle = phaseKey === 'ready' ? '#10b981' : '#4f46e5'; ctx.fill()
    ctx.beginPath(); ctx.arc(w - 2, ly, 6 + Math.sin(tick / 7) * 3, 0, Math.PI * 2)
    ctx.strokeStyle = phaseKey === 'ready' ? 'rgba(16, 185, 129, .3)' : 'rgba(79, 70, 229, .22)'; ctx.lineWidth = 1; ctx.stroke()

    if (face > .02) {
      ctx.save(); ctx.globalAlpha = Math.min(1, face)
      ctx.strokeStyle = phaseKey === 'ready' ? '#10b981' : '#4f46e5'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'
      const cx = w / 2, cy = h / 2, r = 26
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke()
      ctx.fillStyle = ctx.strokeStyle
      ctx.beginPath(); ctx.arc(cx - 9, cy - 7, 2.4, 0, Math.PI * 2); ctx.fill()
      ctx.beginPath(); ctx.arc(cx + 9, cy - 7, 2.4, 0, Math.PI * 2); ctx.fill()
      ctx.beginPath(); ctx.arc(cx, cy + 3, 12, .18 * Math.PI, .82 * Math.PI); ctx.stroke()
      ctx.restore()
    }

    el.fill.style.width = current.toFixed(1) + '%'
    if (phaseKey !== 'ready') el.spin.textContent = `t+${(tick / 60).toFixed(0)}s · ${Math.round(current)}%`
    requestAnimationFrame(draw)
  }
  draw()
</script>
</body>
</html>
